@if(product){
<div class="card-body">
  <form novalidate>
    <fieldset>
      <legend>Product Search Tags</legend>

      <div class="row mt-2">
        <label class="col-md-2 col-form-label" for="categoryId">Category</label>
        <div class="col-md-8">
          <input
            class="form-control"
            id="categoryId"
            type="text"
            placeholder="Category (required)"
            required
            minlength="3"
            [(ngModel)]="product.category"
            name="category"
            #categoryVar="ngModel"
            [ngClass]="{
              'is-invalid':
                (categoryVar.touched ||
                  categoryVar.dirty ||
                  product.id !== '0') &&
                !categoryVar.valid
            }"
          />
          @if(categoryVar.errors?.['required']){
          <span class="invalid-feedback"> A category must be entered. </span>}
          @if(categoryVar.errors?.['minlength']){
          <span class="invalid-feedback">
            The category must be at least 3 characters in length.
          </span>
          }
        </div>
      </div>

      <div class="row mt-2">
        <label class="col-md-2 col-form-label" for="tagsId">Search Tags</label>
        <div class="col-md-8">
          <input
            class="form-control"
            id="tagsId"
            type="text"
            placeholder="Search keywords separated by commas"
            [(ngModel)]="newTags"
            name="tags"
          />
        </div>
        <div class="col-md-1">
          <button
            class="btn btn-outline-primary"
            type="button"
            title="Enter the search keywords separated by commas and then press Add"
            (click)="addTags()"
          >
            Add
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8 offset-md-2">
          @for(tag of product.tags; let i = $index; track i){
          <span>
            <button
              class="btn btn-outline-secondary"
              style="font-size: smaller; margin-bottom: 12px; margin-right: 2px"
              title="Click to remove this tag"
              (click)="removeTag(i)"
            >
              {{ tag }}
              <span class="fa fa-times-circle"></span>
            </button>
          </span>
          }
        </div>
      </div>
    </fieldset>
  </form>
</div>
} @if(errorMessage){
<div class="alert alert-danger">{{ errorMessage }}</div>
}
